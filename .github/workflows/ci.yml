name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "release-please--branches--**"]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.11", "3.12"]
        exclude:
          - os: windows-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
        env:
          DCC_MCP_LOG_DIR: ${{ runner.temp }}/dcc-mcp-logs

  lint-build:
    name: Lint and package build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      # Validate a real Install SOP report, not a fixture: the report is built
      # from a live doctor run and pushed through Core's schema validator. A
      # schema that ships but never executes is how a wrong value reached a
      # release in the incident this gate exists to prevent.
      - name: Validate a real Install SOP report
        run: python -c "from dcc_mcp_photocraft.install_report import validated_report; validated_report(); print('install SOP report is valid')"
      - run: python -m pip install "hatchling==1.32.0" build twine
      - run: python -m build --no-isolation
      - run: python -m twine check dist/*

  native-image:
    name: Official Linux native image workflow
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,mcp]" pillow==12.3.0
      - name: Download and verify official native runtime
        run: |
          curl --fail --location --retry 2 https://github.com/storytold/photocraft/releases/download/v0.15.1/photocraft-0.15.1-linux-x86_64.tar.gz -o "${RUNNER_TEMP}/photocraft.tar.gz"
          echo 'b622be40355513056f8152afe895d0a05c1bc3c344a027f772a9a12fa3d1c223  '"${RUNNER_TEMP}/photocraft.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/photocraft.tar.gz" -C "${RUNNER_TEMP}"
          echo '16fbb244d69d5c32dd60435e95b1c893d04bf7ef6e3d37fb967eecb57f6e0bea  '"${RUNNER_TEMP}/photocraft-0.15.1-linux-x86_64/bin/photocraft-cli" | sha256sum -c -
      - name: Genuine Core MCP image acceptance
        run: python scripts/native_showcase.py --cli "${RUNNER_TEMP}/photocraft-0.15.1-linux-x86_64/bin/photocraft-cli" --output evidence/native-core-ci
        env:
          DCC_MCP_LOG_DIR: ${{ runner.temp }}/dcc-mcp-logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photocraft-native-core-evidence
          path: evidence/native-core-ci/
          retention-days: 14
