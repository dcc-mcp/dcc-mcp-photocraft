[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "dcc-mcp-photocraft"
version = "0.2.0"
description = "PhotoCraft adapter for the DCC Model Context Protocol (MCP) ecosystem"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "loonghao", email = "hal.long@outlook.com" }]
keywords = ["photocraft", "image", "editor", "mcp", "dcc", "ai", "model-context-protocol"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics",
]
# 0.20.40 is the org target: it is where the shared Install SOP API becomes
# unconditionally available, which this adapter uses in its report validation.
dependencies = ["dcc-mcp-core>=0.20.40,<1.0.0"]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.8", "twine>=6"]
# The optional stdio bridge reuses PhotoCraft's own MCP server through the
# official SDK. The SDK requires Python 3.10+, so declaring it as a
# version-gated extra keeps the default install usable on 3.9.
mcp = ["mcp>=1.30,<2; python_version >= '3.10'"]

[project.urls]
Homepage = "https://github.com/dcc-mcp/dcc-mcp-photocraft"
Repository = "https://github.com/dcc-mcp/dcc-mcp-photocraft"
Issues = "https://github.com/dcc-mcp/dcc-mcp-photocraft/issues"

[project.scripts]
dcc-mcp-photocraft = "dcc_mcp_photocraft.cli:main"
dcc-mcp-photocraft-install = "dcc_mcp_photocraft.install:main"

[project.entry-points."dcc_mcp.adapters"]
photocraft = "dcc_mcp_photocraft:PhotoCraftMcpServer"

[tool.hatch.build.targets.wheel]
packages = ["src/dcc_mcp_photocraft"]
artifacts = ["src/dcc_mcp_photocraft/skills/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
