[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dcc-mcp-photocraft"
version = "0.1.0a1"
description = "Experimental headless PhotoCraft adapter for DCC-MCP"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["dcc-mcp-core>=0.20.41,<0.21", "mcp==1.27.0", "Pillow>=12.3,<13"]
classifiers = ["Development Status :: 3 - Alpha"]

[project.optional-dependencies]
test = ["pytest>=8.3", "ruff>=0.8", "build>=1.2", "jsonschema>=4.18"]

[project.scripts]
dcc-mcp-photocraft = "dcc_mcp_photocraft.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.package-data]
dcc_mcp_photocraft = ["upstream_schemas.json", "skills/**/*.md", "skills/**/*.yaml", "skills/**/*.py"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["e2e: requires the official PhotoCraft v0.2.0 executable"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
