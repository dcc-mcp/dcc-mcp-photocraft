tools:
  - name: document_info
    description: >-
      Return a JSON summary of one PhotoCraft document (.pcraft): layer tree,
      dimensions and colour mode. Runs headlessly through photocraft-cli.
    input_schema:
      type: object
      properties:
        path:
          type: string
          description: Path to the .pcraft document to inspect.
      required: [path]
      additionalProperties: false
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: any
    timeout_hint_secs: 60
    source_file: scripts/document_info.py
  - name: list_photocraft_commands
    description: >-
      List the engine command table the installed PhotoCraft publishes. Call this
      instead of assuming a command exists: the table is read from the host at
      call time and grows between upstream releases.
    input_schema:
      type: object
      properties: {}
      additionalProperties: false
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: any
    timeout_hint_secs: 60
    source_file: scripts/list_photocraft_commands.py
  - name: list_photocraft_methods
    description: >-
      List the headless session methods the installed PhotoCraft publishes.
    input_schema:
      type: object
      properties: {}
      additionalProperties: false
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: any
    timeout_hint_secs: 60
    source_file: scripts/list_photocraft_methods.py
  - name: ui_screenshot
    description: >-
      Capture the running PhotoCraft window. Requires the desktop app started with
      `--control <port>` and a token; fails with guidance when no instance is
      attached.
    input_schema:
      type: object
      properties: {}
      additionalProperties: true
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: false
    execution: sync
    # This is an external authenticated socket client, not embedded host Python.
    affinity: any
    timeout_hint_secs: 60
    source_file: scripts/ui_screenshot.py
  - name: ui_inspect
    description: >-
      Inspect the running PhotoCraft UI tree. Requires the desktop app started
      with `--control <port>` and a token.
    input_schema:
      type: object
      properties: {}
      additionalProperties: true
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    # This is an external authenticated socket client, not embedded host Python.
    affinity: any
    timeout_hint_secs: 60
    source_file: scripts/ui_inspect.py
  - name: execute_photocraft_image_batch
    description: 'Run a reviewed, bounded native image workflow in one owned CLI session: original PNG import, editable
      Smart Object/layers/masks/Curves, native save-close-reopen and PNG export. Does not continue unsaved work across
      calls; never forwards arbitrary commands.'
    input_schema:
      type: object
      additionalProperties: false
      required:
      - steps
      properties:
        steps:
          type: array
          minItems: 1
          maxItems: 48
          items:
            oneOf:
            - type: object
              additionalProperties: false
              properties:
                op:
                  const: open_png
                document:
                  type: string
                  pattern: ^[A-Za-z][A-Za-z0-9_-]{0,47}$
                input:
                  type: string
                  minLength: 1
                  maxLength: 240
                base_layer:
                  type: string
                  pattern: ^[A-Za-z][A-Za-z0-9_-]{0,47}$
              required:
              - op
              - document
              - input
              - base_layer
            - type: object
              additionalProperties: false
              properties:
                op:
                  const: place_png
                document:
                  type: string
                  pattern: ^[A-Za-z][A-Za-z0-9_-]{0,47}$
                input:
                  type: string
                  minLength: 1
                  maxLength: 240
                layer:
                  type: string
                  pattern: ^[A-Za-z][A-Za-z0-9_-]{0,47}$
                center:
                  type: array
                  items:
                    type: number
                    minimum: 0
                    maximum: 4096
                  minItems: 2
                  maxItems: 2
                scale:
                  type: number
                  exclusiveMinimum: 0
                  maximum: 400
              required:
              - op
              - document
              - input
              - layer
              - center
              - scale
            - type: object
              additionalProperties: false
              properties:
                op:
                  const: set_layer
                document:
                  type: string
                  pattern: ^[A-Za-z][A-Za-z0-9_-]{0,47}$
                layer:
                  type: string
                  pattern: ^[A-Za-z][A-Za-z0-9_-]{0,47}$
                name:
                  type: string
                  minLength: 1
                  maxLength: 128
                  pattern: ^[^\x00-\x1f]+$
                visible:
                  type: boolean
                opacity:
                  type: number
                  minimum: 0
                  maximum: 1
              required:
              - op
              - document
              - layer
            - type: object
              additionalProperties: false
              properties:
                op:
                  const: mask_rectangle
                document:
                  type: string
                  pattern: ^[A-Za-z][A-Za-z0-9_-]{0,47}$
                layer:
                  type: string
                  pattern: ^[A-Za-z][A-Za-z0-9_-]{0,47}$
                x:
                  type: integer
                  minimum: 0
                  maximum: 4096
                y:
                  type: integer
                  minimum: 0
                  maximum: 4096
                width:
                  type: integer
                  minimum: 1
                  maximum: 4096
                height:
                  type: integer
                  minimum: 1
                  maximum: 4096
                ellipse:
                  type: boolean
              required:
              - op
              - document
              - layer
              - x
              - y
              - width
              - height
            - type: object
              additionalProperties: false
              properties:
                op:
                  const: set_mask
                document:
                  type: string
                  pattern: ^[A-Za-z][A-Za-z0-9_-]{0,47}$
                layer:
                  type: string
                  pattern: ^[A-Za-z][A-Za-z0-9_-]{0,47}$
                density:
                  type: number
                  minimum: 0
                  maximum: 100
                feather:
                  type: number
                  minimum: 0
                  maximum: 32
                enabled:
                  type: boolean
              required:
              - op
              - document
              - layer
            - type: object
              additionalProperties: false
              properties:
                op:
                  const: curves
                document:
                  type: string
                  pattern: ^[A-Za-z][A-Za-z0-9_-]{0,47}$
                layer:
                  type: string
                  pattern: ^[A-Za-z][A-Za-z0-9_-]{0,47}$
                points:
                  type: array
                  minItems: 2
                  maxItems: 8
                  items:
                    type: array
                    minItems: 2
                    maxItems: 2
                    items:
                      type: integer
                      minimum: 0
                      maximum: 255
              required:
              - op
              - document
              - layer
              - points
            - type: object
              additionalProperties: false
              properties:
                op:
                  const: inspect
                document:
                  type: string
                  pattern: ^[A-Za-z][A-Za-z0-9_-]{0,47}$
              required:
              - op
              - document
            - type: object
              additionalProperties: false
              properties:
                op:
                  const: save_project
                document:
                  type: string
                  pattern: ^[A-Za-z][A-Za-z0-9_-]{0,47}$
                output:
                  type: string
                  minLength: 1
                  maxLength: 240
              required:
              - op
              - document
              - output
            - type: object
              additionalProperties: false
              properties:
                op:
                  const: close
                document:
                  type: string
                  pattern: ^[A-Za-z][A-Za-z0-9_-]{0,47}$
              required:
              - op
              - document
            - type: object
              additionalProperties: false
              properties:
                op:
                  const: reopen_project
                document:
                  type: string
                  pattern: ^[A-Za-z][A-Za-z0-9_-]{0,47}$
                output:
                  type: string
                  minLength: 1
                  maxLength: 240
              required:
              - op
              - document
              - output
            - type: object
              additionalProperties: false
              properties:
                op:
                  const: export_png
                document:
                  type: string
                  pattern: ^[A-Za-z][A-Za-z0-9_-]{0,47}$
                output:
                  type: string
                  minLength: 1
                  maxLength: 240
              required:
              - op
              - document
              - output
    output_schema:
      type: object
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: any
    timeout_hint_secs: 150
    source_file: scripts/execute_photocraft_image_batch.py
